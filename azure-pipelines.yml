variables:
  isMain: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  isDevelop: $[eq(variables['Build.SourceBranch'], 'refs/heads/develop')]

trigger:
  - main
  - feat/*
  - develop

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: false

  - script: |
      git config --global user.name "Azure Devops Pipeline"
      git config --global user.email "roberg.guehne@progressiveui.org"
    displayName: Git config user

  - task: NodeTool@0
    inputs:
      versionSpec: "22.x"
    displayName: "Install Node.js"

  - script: |
      corepack enable
      corepack prepare yarn@1.22.22 --activate
    displayName: "Activate Yarn 1.22.22"

  - bash: echo "##vso[task.setvariable variable=yarnCacheDir;]$(yarn cache dir)"
    displayName: Set yarn cache dir variable

  - script: |
      npmVersionString=$(node -p "require('./package.json').version")
      echo "##vso[build.updatebuildnumber]$npmVersionString"
    displayName: "set build number"
  - task: Cache@2
    inputs:
      key: '"yarn" | "$(Agent.OS)" | yarn.lock'
      restoreKeys: |
        yarn | "$(Agent.OS)"
        yarn
      path: $(yarnCacheDir)
    displayName: Cache Yarn packages

  - script: |
      yarn install --frozen-lockfile
    displayName: "yarn install"

  - script: |
      yarn validate
    displayName: "Validate lint, types, tests, builds and packages"
    env:
      NEXT_PUBLIC_API: $(NEXT_PUBLIC_API)
      NEXT_PUBLIC_ALGOLIA_APP_ID: $(NEXT_PUBLIC_ALGOLIA_APP_ID)
      NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY: $(NEXT_PUBLIC_ALGOLIA_SEARCH_API_KEY)

  - script: |
      set -euo pipefail
      yarn lerna version --no-push --conventional-commits --conventional-graduate --yes
    displayName: "Version stable packages"
    condition: and(succeeded(), eq(variables.isMain, 'true'))

  - script: |
      set -euo pipefail
      yarn lerna version --no-push --conventional-commits --conventional-prerelease --preid alpha --yes
    displayName: "Version alpha packages"
    condition: and(succeeded(), eq(variables.isDevelop, 'true'))

  - task: DownloadSecureFile@1
    name: npmrcFile
    displayName: "Download npm publish configuration"
    inputs:
      secureFile: "npmrc"
    condition: and(succeeded(), or(eq(variables.isMain, 'true'), eq(variables.isDevelop, 'true')))

  - task: CmdLine@2
    displayName: "Materialize npm publish configuration"
    inputs:
      script: cp $(npmrcFile.secureFilePath) ./.npmrc
    condition: and(succeeded(), or(eq(variables.isMain, 'true'), eq(variables.isDevelop, 'true')))

  - script: |
      set -euo pipefail
      yarn lerna publish from-package --temp-tag --yes
      git -c http.extraheader="AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" push --follow-tags origin HEAD:refs/heads/main
    displayName: "lerna publish"
    condition: and(succeeded(), eq(variables.isMain, 'true'))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - script: |
      set -euo pipefail
      yarn lerna publish from-package --dist-tag alpha --temp-tag --yes
      git -c http.extraheader="AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" push --follow-tags origin HEAD:refs/heads/develop
    displayName: "lerna publish alpha (Develop)"
    condition: and(succeeded(), eq(variables.isDevelop, 'true'))
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - script: rm -f .npmrc
    displayName: "Remove npm publish configuration"
    condition: and(always(), or(eq(variables.isMain, 'true'), eq(variables.isDevelop, 'true')))

  - script: |
      set -euo pipefail
      git -c http.extraheader="AUTHORIZATION: bearer $SYSTEM_ACCESSTOKEN" clone --mirror "$(Build.Repository.Uri)" repo-mirror
      git -C repo-mirror \
        -c credential.helper= \
        -c 'credential.helper=!f() { printf "%s\n" "username=$AWS_GIT_USERNAME" "password=$AWS_GIT_PASSWORD"; }; f' \
        push --mirror "https://${AWS_REPO_URL}"
    displayName: "Sync released repository with AWS CodeCommit"
    condition: and(succeeded(), or(eq(variables.isMain, 'true'), eq(variables.isDevelop, 'true')))
    env:
      AWS_REPO_URL: $(AWS_REPO_URL)
      AWS_GIT_USERNAME: $(AWS_GIT_USERNAME)
      AWS_GIT_PASSWORD: $(AWS_GIT_PASSWORD)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: "./packages/react"
      artifact: "uncore-react"
      publishLocation: "pipeline"
